<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v6.5.1/css/all.css">
    <title>Weather App</title>
    <style>




    </style>
</head>

<body>

    <div class="container">

        <div class="child">
            <i id="toogle-btn" class="fa-regular fa-moon fa-lg"></i>
            <header>
                <input type="search" placeholder="Search City" id="searchBar">
                <p class="error"></p>
            </header>

            <section>
                <div class="iconDiv">
                    <img src="" alt="image representing weather">
                </div>

                <div class="info">
                    <h2>21 C</h2>
                    <p>Lahore - partily cloudly</p>
                    <p class="date">Monday May 26, 2026</p>
                    <div class="icons">
                        <p>💧 <span id="humidity"></span>%</p>
                        <p>💨 <span id="wind"></span> km/h</p>
                    </div>
                </div>
            </section>

            <section id="UpcomingDays">
                <div class="daysCard">
                    <h3>Mon</h3>
                    <img src="" alt="weather image">
                    <h2>22 C</h2>
                </div>
            </section>
            <footer>
                <span class="footer-label">Recent</span>
                <div id="lastSearchedList">
                    <h1 id="lastSearched">Lahore</h1>
                </div>
              
            </footer>
        </div>
    </div>

<script type="module" src="./js/main.js"></script>
</body>

</html>
